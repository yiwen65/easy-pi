name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      # The find tool only applies .gitignore files outside git repositories with fd 8.7.0+.
      # Fail loudly here instead of silently skipping the gitignore regression tests.
      - name: Verify fd supports --no-require-git
        run: |
          fd --version
          fd --help | grep -q -- '--no-require-git'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify compiled native product
        run: PI_OFFLINE=1 node scripts/check-native-subagent-product.mjs

      # These private-package tests are not reached by the workspace test scripts.
      - name: Verify native collaboration contracts
        working-directory: packages/subagent
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/collaboration-contract.test.ts test/collaboration-controller.test.ts
          test/collaboration-history-store.test.ts test/collaboration-lifecycle.test.ts
          test/collaboration-mailbox.test.ts test/collaboration-progress.test.ts
          test/collaboration-storage.test.ts test/collaboration-targeted-wait.test.ts
          test/context-fork.test.ts

      - name: Verify permission contracts
        working-directory: packages/permissions
        run: |
          node --test test/permissions.test.ts
          node ../../node_modules/vitest/dist/cli.js --run test/external-mutation-journal.test.ts

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
