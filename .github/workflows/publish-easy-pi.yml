name: Publish easy-pi

on:
  push:
    tags:
      - 'easy-pi-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:offline
      - name: Resolve release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#easy-pi-v}" >> "$GITHUB_OUTPUT"
      - run: npm run pack:easy-pi "$RUNNER_TEMP/easy-pi-pack"
        env:
          EASY_PI_VERSION: ${{ steps.version.outputs.version }}
      - name: Verify package metadata
        run: |
          node -e 'const p=require(process.argv[1]); if (p.name !== "easy-pi" || p.version !== process.argv[2] || !p.bin.epi) process.exit(1)' "$RUNNER_TEMP/easy-pi-pack/package.json" "${{ steps.version.outputs.version }}"
      - name: Publish beta
        run: npm publish "$RUNNER_TEMP/easy-pi-pack/easy-pi-${{ steps.version.outputs.version }}.tgz" --access public --tag beta --provenance
