name: Publish easy-pi

on:
  push:
    tags:
      - 'easy-pi-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:offline
      - run: npm run pack:easy-pi "$RUNNER_TEMP/easy-pi-pack"
      - name: Verify package metadata
        run: |
          node -e 'const p=require(process.argv[1]); if (p.name !== "easy-pi" || p.version !== "0.1.0-beta.1" || !p.bin.epi) process.exit(1)' "$RUNNER_TEMP/easy-pi-pack/package.json"
      - name: Publish beta
        run: npm publish "$RUNNER_TEMP/easy-pi-pack/easy-pi-0.1.0-beta.1.tgz" --access public --tag beta --provenance
