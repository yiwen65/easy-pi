name: Publish easy-pi

on:
  push:
    tags:
      - 'easy-pi-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing beta release tag to publish
        required: true
        type: string
        default: easy-pi-v0.1.0-beta.1

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^easy-pi-v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#easy-pi-v}" >> "$GITHUB_OUTPUT"
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve frozen release model data
        env:
          RELEASE_TAG: ${{ steps.release.outputs.ref }}
        run: cp ".github/model-data/$RELEASE_TAG.json" "$RUNNER_TEMP/easy-pi-model-data.json"
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Hydrate frozen model data
        run: npm --prefix packages/ai run hydrate-model-data -- --normalized-input "$RUNNER_TEMP/easy-pi-model-data.json"
      - run: npm run build:offline
      - run: npm run pack:easy-pi "$RUNNER_TEMP/easy-pi-pack"
        env:
          EASY_PI_VERSION: ${{ steps.release.outputs.version }}
      - name: Verify package metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node -e 'const p=require(process.argv[1]); if (p.name !== "easy-pi" || p.version !== process.argv[2] || !p.bin.epi) process.exit(1)' "$RUNNER_TEMP/easy-pi-pack/package.json" "$RELEASE_VERSION"
      - name: Publish beta
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "$RUNNER_TEMP/easy-pi-pack/easy-pi-$RELEASE_VERSION.tgz" --access public --tag beta --provenance
