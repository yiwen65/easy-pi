<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">easy-pi runtime architecture</title>
  <desc id="desc">The epi CLI opens an agent session; around it sit four rebuilt boundaries — built-in tools, a cache-aware model runtime, context compaction, and native subagent collaboration — with sessions persisted under ~/.epi/agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #f8fafc; }
      .small { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .muted { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #94a3b8; }
      .box { fill: #172235; stroke: #334155; stroke-width: 2; }
      .accent { fill: #102b3e; stroke: #38bdf8; stroke-width: 2; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="60" class="small" fill="#7dd3fc">EASY-PI / RUNTIME MAP</text>
  <text x="64" y="104" class="label" font-size="34">One session runtime, four hard boundaries</text>
  <text x="64" y="136" class="muted">compact · delegate · stay cache-warm · act with real tools</text>

  <g aria-label="CLI layer">
    <rect x="64" y="180" width="260" height="120" rx="16" class="accent"/>
    <text x="88" y="224" class="label">epi CLI</text>
    <text x="88" y="252" class="small">grok-tui engine</text>
    <text x="88" y="276" class="muted">interactive · print · rpc</text>
  </g>

  <g aria-label="session layer">
    <rect x="430" y="168" width="340" height="144" rx="16" class="box"/>
    <text x="458" y="212" class="label">Agent session</text>
    <text x="458" y="240" class="small">coding-agent</text>
    <text x="458" y="264" class="muted">prompt · queue · context</text>
    <text x="458" y="288" class="muted">rebuilt per provider call</text>
  </g>

  <path d="M332 240H422" class="line"/>

  <g aria-label="persistence">
    <rect x="876" y="180" width="260" height="120" rx="16" class="box"/>
    <text x="900" y="224" class="label">~/.epi/agent</text>
    <text x="900" y="252" class="small">sessions·teams</text>
    <text x="900" y="276" class="muted">continue · resume · fork</text>
  </g>

  <path d="M778 240H868" class="line"/>

  <g aria-label="tools">
    <rect x="64" y="400" width="250" height="112" rx="16" class="box"/>
    <text x="88" y="442" class="label">Built-in tools</text>
    <text x="88" y="470" class="small">read·bash·edit·write</text>
    <text x="88" y="494" class="muted">web · background tasks</text>
  </g>
  <path d="M600 312L189 392" class="line"/>

  <g aria-label="models">
    <rect x="338" y="400" width="250" height="112" rx="16" class="accent"/>
    <text x="362" y="442" class="label">Model runtime</text>
    <text x="362" y="470" class="small">agent→ai→providers</text>
    <text x="362" y="494" class="muted">cache-affinity · retries</text>
  </g>
  <path d="M600 312L463 392" class="line"/>

  <g aria-label="compaction">
    <rect x="612" y="400" width="250" height="112" rx="16" class="accent"/>
    <text x="636" y="442" class="label">Compaction</text>
    <text x="636" y="470" class="small">checkpoints·95% trigger</text>
    <text x="636" y="494" class="muted">goal hierarchy preserved</text>
  </g>
  <path d="M600 312L737 392" class="line"/>

  <g aria-label="collaboration">
    <rect x="886" y="400" width="250" height="112" rx="16" class="accent"/>
    <text x="910" y="442" class="label">Native subagents</text>
    <text x="910" y="470" class="small">delegation contract</text>
    <text x="910" y="494" class="muted">mailboxes · /agents</text>
  </g>
  <path d="M600 312L1011 392" class="line"/>
  <path d="M1011 392V308" class="line"/>

  <text x="64" y="592" class="small">easy-pi bundles the fork runtime; extension names stay Pi-compatible.</text>
</svg>
